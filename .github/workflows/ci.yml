name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Show critical versions
        run: |
          python -V
          python - << 'PY'
          import importlib
          for pkg in ("numpy", "numba", "llvmlite", "xesmf", "xarray"):
              try:
                  m = importlib.import_module(pkg)
                  print(f"{pkg} {getattr(m, '__version__', 'n/a')}")
              except Exception as e:
                  print(f"{pkg} NOT INSTALLED: {e}")
          PY


      - name: Test (pytest)
        run: pytest

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ci-lint
      - name: Install Ruff
        run: conda install --yes --name ci-lint --override-channels --channel conda-forge ruff
      - name: Lint (Ruff)
        run: conda run --name ci-lint ruff check .
