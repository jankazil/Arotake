name: arotake
channels:
  - conda-forge
  - jan.kazil
dependencies:
  # Core interpreter and package-management tools.
  - python>=3.11,<=3.12.9
  - pip
  - mamba

  # Build-system requirements from pyproject.toml.
  - setuptools>=77
  - wheel

  # Runtime dependencies.
  - cartopy
  - cftime
  - geopandas
  - h5netcdf
  - libnetcdf
  - matplotlib
  - netcdf4
  - numpy
  - pandas
  - proj
  - pyproj
  - regionmask>=0.13
  - scipy
  - xarray
  - xesmf>=0.7
  - hrrr-data
  - lcd-v2-data

  # Development tooling, kept here because setup-dev-env.sh installs .[dev] with --no-deps.
  - pytest
  - pytest-cov
  - mypy
  - ruff
  - pre-commit

  # Jupyter support.
  - jupyter_client
  - jupyter_core
  - notebook
  - ipykernel
