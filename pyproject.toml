[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arotake"
version = "2.1.20"
description = "Arotake is a Python toolkit for evaluating meteorological forecast models against observations."
readme = "README.md"
requires-python = ">=3.12,<=3.12.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jan Kazil" }]
dependencies = [
  "cartopy",
  "cftime",
  "geopandas",
  "h5netcdf",
  "matplotlib",
  "netcdf4",
  "numpy",
  "pandas",
  "pyproj",
  "regionmask>=0.13",
  "scipy",
  "xarray",
  "hrrr-data",
  "lcd-v2-data",
]
[project.scripts]
analyze-hrrr-vs-observations = "arotake.analyze_hrrr_vs_observations:main" # Connects name of executable in $PATH to the python module containing main()

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["arotake"]

[tool.ruff]
line-length = 128
target-version = "py311"
extend-exclude = [
    "dist",
    "build",
    "data",
    "demos",
    "docs",
    "experiments",
    "notebooks",
    "plots",
    "results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.format]
quote-style = "preserve"

#
# MyPy is not used because static analysis cannot account for all
# dynamic runtime behaviors, mypy may report false positives which
# do no reflect actual runtime issues.
#
#[tool.mypy]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
